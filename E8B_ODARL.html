<I DOCTYPE html>
    <!-- declaracion de tipo de documento -->
<html lang="en">
    <!-- encabezado de la pagina-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo de la pagina-->
    <title>Imagenes de HTML</title>
</head>
<!-- cuerpo de la pagina -->
<body>
    <!-- Se utiliza "h1" para definir el título principal de la página -->
    <h1>EMILIANI SOMASCOS</h1>
    <!-- img hace un llamado a una imagen de nombre "ODALR_C.gif" y se le da un texto alternativo en caso de que la imagen no pueda ser cargada -->
   <img src="bd.gif" alt="Logo del lenguaje C++">
   <!-- Gif agregado para probar el agregar multiples elementos "GIF" en un unico documento-->
   <img src="v1.gif" alt="GmodDance">
</body>
</html>
